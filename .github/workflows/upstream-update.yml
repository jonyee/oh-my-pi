name: Upstream release update PR

on:
  schedule:
    - cron: "50 23 * * 6" # Saturdays at 23:50 UTC; first planned run 2026-10-10.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-release-update-pr
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'jonyee/oh-my-pi'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Propose latest stable upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci-upstream-update.ts
